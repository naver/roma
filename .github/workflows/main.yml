name: Unit tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run_unit_tests_job:
    runs-on: ubuntu-latest
    name: Run unit tests

    strategy:
      matrix:
        include:
          # Latest PyTorch
          - python-version: "3.x"
            pytorch-version: "torch"
            numpy-version: "numpy"
          # Oldest supported PyTorch (no torch.amp.custom_fwd, fallback to torch.cuda.amp)
          - python-version: "3.11"
            pytorch-version: "torch==2.0.1"
            numpy-version: "numpy<2"
          # Last version before torch.amp.custom_fwd was introduced in PyTorch 2.4
          - python-version: "3.12"
            pytorch-version: "torch==2.3.1"
            numpy-version: "numpy<2"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{matrix.pytorch-version}}" "${{matrix.numpy-version}}" --no-cache-dir

      - name: Prepare repo
        uses: actions/checkout@master

      - name: Run unit tests.
        run: |
          python -m unittest

  lint:
    runs-on: ubuntu-latest
    name: Ruff format & lint

    steps:
      - name: Prepare repo
        uses: actions/checkout@master

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Check formatting
        run: ruff format --check roma test examples

      - name: Lint
        run: ruff check roma test examples