name: Unit tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run_unit_tests_job:
    runs-on: ubuntu-latest
    name: Run unit tests

    strategy:
      matrix:
        python-version: ["3.x"]
        pytorch-version: ["torch"]
        
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{matrix.pytorch-version}} numpy --no-cache-dir

      - name: Prepare repo
        uses: actions/checkout@master

      - name: Run unit tests.
        run: |
          python -m unittest

  lint:
    runs-on: ubuntu-latest
    name: Ruff format & lint

    steps:
      - name: Prepare repo
        uses: actions/checkout@master

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Check formatting
        run: ruff format --check roma test examples

      - name: Lint
        run: ruff check roma test examples