[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "roma"
version = "1.6"
description = "A lightweight library to deal with 3D rotations in PyTorch."
readme = "README.md"
authors = [{ name = "Romain Brégier", email = "romain.bregier@naverlabs.com" }]
license = "BSD-3-Clause"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/naver/roma"

[dependency-groups]
dev = [
    "ruff==0.16.2",
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.setuptools]
packages = ["roma"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly to keep behavior stable across ruff versions.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]  # I, O as math identifiers (identity matrix etc.) are idiomatic here

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]  # git-submodule shim re-exporting roma's star imports
"roma/__init__.py" = ["F403"]  # star re-exports are the public API pattern
"test/test_transforms.py" = ["F403", "F405"]
